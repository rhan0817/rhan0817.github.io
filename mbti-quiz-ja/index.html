.hub-link{

}
.hub-link:hover{ color:var(--accent); }

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

#start{

  padding:40px 28px 32px;
  border-radius:28px;

  background:var(--glass);

}

}
.mbti-btn{
  font-family:var(--body); font-weight:800; font-size:16.5px;

  color:var(--ink); background:var(--surface-2);

}

#start .meta{
  margin-top:14px; font-size:14px; color:var(--ink-soft);
}
.alt-link{

  color:var(--ink-soft); text-decoration:none;
  background:none; border:none; cursor:pointer;
  padding:0;
}
.alt-link:hover{ color:var(--accent); }

.btn-primary{
  font-family:var(--body); font-weight:700; font-size:18.5px;
  border:none; border-radius:16px;
  padding:16px 36px; cursor:pointer;
  margin-top:4px;
}
#start .btn-primary{ color:#fff; background:var(--ink); }
:root[data-theme="dark"] #start .btn-primary{ color:var(--bg); }

  border-radius:28px;
  color:var(--ink);
  background:var(--glass);

.rail{

  margin-bottom:22px;
}
.back-btn{

.back-btn svg{ width:18px; height:18px; }
.back-btn:active{ transform:scale(0.95); }
.rail-track{
  flex:1; height:6px; border-radius:4px;
  background:var(--line); overflow:hidden;
}
.rail-fill{
  height:100%; border-radius:4px;
  background:var(--accent);
  transition:width .35s ease;
}
.rail-count{
  font-variant-numeric:tabular-nums;
  font-size:14.5px; font-weight:700; color:var(--ink-soft);
  white-space:nowrap;
}
.q-title{
  font-family:var(--display); font-weight:700;
  font-size:clamp(21px,5.2vw,26px); line-height:1.45;

.options{ display:flex; flex-direction:column; gap:10px; }
.option{

  box-shadow:0 10px 24px -20px rgba(33,31,28,0.3);
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:active{ transform:scale(0.99); }

.hero-icon-circle{

#result{ text-align:center; }
.hero-icon-circle.cycling{

@keyframes pulse-circle{
  0%, 100%{ transform:scale(1); }

.reveal-body{
  opacity:0; transform:translateY(10px);
  transition: opacity .45s ease, transform .45s ease;
}
.reveal-body.show{ opacity:1; transform:translateY(0); }

  .hero-icon-circle.cycling{ animation:none; }

#result .type-code{

#result h1{

#result .tagline{

.stage-row{ padding:16px 0; }

.stage-label{

.result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
.btn-ghost{

}
.btn-ghost:active{ transform:scale(0.98); }
.copied{ font-size:14.5px; color:var(--ink-soft); margin-top:10px; height:16px; text-align:center; }

footer{

.sponsor-link{

.sponsor-link:hover{ text-decoration:underline; }
.q-title, .stage-text, #start p.lede{ line-break:strict; word-break:normal; overflow-wrap:anywhere; }
</style>

/* ---------------- questions: 12 total, 3 per axis ---------------- */
var QUESTIONS = [
  { q:"好きな人とのデートが終わったら、あなたは：", opts:[
      {label:"すぐ親友にメッセージして、さっきの出来事を全部シェアする", pole:"E"},
      {label:"ひとりで余韻にひたって、急いで誰かに話したりはしない", pole:"I"} ] },
  { q:"集まりが何件も続いたあと、一番したいことは：", opts:[
      {label:"もう一軒行く！人が多いほど元気が出る", pole:"E"},
      {label:"家に帰って、ひとり静かに充電する", pole:"I"} ] },
  { q:"誰かを好きになったら、あなたは：", opts:[
      {label:"自分から話題やきっかけをたくさん作って、相手と関わる", pole:"E"},
      {label:"そばでそっと観察して、相手が近づいてくるのを待つ", pole:"I"} ] },
  { q:"デート中、目に入りやすいのは：", opts:[

  { q:"将来の話をするとき、話したいのは：", opts:[

  { q:"相手からメッセージが届いたら、あなたは：", opts:[
      {label:"書いてあるとおりに受け取る。言われたことがすべて", pole:"S"},
      {label:"行間に別の意味がないか、つい考えてしまう", pole:"N"} ] },
  { q:"ケンカになったとき、あなたは：", opts:[
      {label:"まず筋道を立てて、何が問題なのかはっきりさせたい", pole:"T"},
      {label:"まず相手が今どんな気持ちかを気にかける", pole:"F"} ] },
  { q:"友だちから恋愛相談をされたら、あなたは：", opts:[
      {label:"メリット・デメリットを分析して、現実的なアドバイスをする", pole:"T"},
      {label:"まずは気持ちを全部吐き出させてあげて、それからゆっくり話す", pole:"F"} ] },
  { q:"恋愛に関わる決断をするとき、信じるのは：", opts:[
      {label:"一度冷静になって考え抜いたロジック", pole:"T"},
      {label:"その瞬間の、心のいちばん正直な気持ち", pole:"F"} ] },
  { q:"デートの予定を立てるとき、いつもは：", opts:[
      {label:"時間と場所を前もって決めて、計画どおりに動く", pole:"J"},
      {label:"その時の気分次第。直前に決めてもぜんぜんOK", pole:"P"} ] },
  { q:"恋の進み方は、どちらがいい？", opts:[
      {label:"早めに関係をはっきりさせて、落ち着きたい", pole:"J"},
      {label:"少し余白を残して、自然の流れにまかせたい", pole:"P"} ] },
  { q:"予定が急に崩れたとき、あなたの反応は：", opts:[

      {label:"平気。臨機応変に動くのは得意", pole:"P"} ] }

var current = 0;
var answers = [];
var shuffledOrders = [];

function computeCode(){
  var tally = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  answers.forEach(function(pole){ if(pole) tally[pole]++; });
  var code = "";
  code += tally.E >= tally.I ? "E" : "I";
  code += tally.S >= tally.N ? "S" : "N";
  code += tally.T >= tally.F ? "T" : "F";
  code += tally.J >= tally.P ? "J" : "P";
  return code;
}

var railFill = document.getElementById("rail-fill");
var railCount = document.getElementById("rail-count");
var qTitle = document.getElementById("q-title");
var qOptions = document.getElementById("q-options");
var qBackBtn = document.getElementById("q-back-btn");

qBackBtn.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

function renderQuestion(){
  var total = QUESTIONS.length;
  railFill.style.width = (current/total*100)+"%";
  railCount.textContent = (current+1)+" / "+total;
  qBackBtn.style.visibility = current===0 ? "hidden" : "visible";

  var item = QUESTIONS[current];
  qTitle.textContent = item.q;
  qOptions.innerHTML = "";

  var order = shuffledOrders[current];
  if(!order){
    order = Math.random() < 0.5 ? [0,1] : [1,0];
    shuffledOrders[current] = order;
  }

  order.forEach(function(idx){
    var opt = item.opts[idx];
    var btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = opt.label;
    btn.addEventListener("click", function(){
      answers[current] = opt.pole;
      if(current < QUESTIONS.length - 1){
        current++;
        renderQuestion();
      } else {
        revealResult(computeCode());
      }
    });
    qOptions.appendChild(btn);
  });
}

document.getElementById("start-btn").addEventListener("click", function(){
  current = 0;
  answers = [];
  shuffledOrders = [];
  document.getElementById("start").hidden = true;
  document.getElementById("quiz").hidden = false;
  window.scrollTo(0,0);
  renderQuestion();
});

document.getElementById("to-picker").addEventListener("click", function(){
  document.getElementById("start").hidden = true;
  document.getElementById("picker").hidden = false;
  window.scrollTo(0,0);
});

document.getElementById("to-start").addEventListener("click", function(){
  document.getElementById("picker").hidden = true;

});

function showResult(code){
  var t = TYPES[code];
  if(!t) return;
  document.getElementById("r-code").textContent = code;
  document.getElementById("r-code").classList.remove("cycling");
  document.getElementById("r-code-label").textContent = code;
  document.getElementById("r-name").textContent = t.name;
  document.getElementById("r-tagline").textContent = t.tagline;
  var descEl = document.getElementById("r-desc");
  descEl.innerHTML = "";
  t.stages.forEach(function(s){
    var row = document.createElement("div");
    row.className = "stage-row";
    var label = document.createElement("div");
    label.className = "stage-label";
    label.textContent = s.label;
    var text = document.createElement("div");
    text.className = "stage-text";
    text.textContent = s.text;
    row.appendChild(label);
    row.appendChild(text);
    descEl.appendChild(row);
  });
  document.getElementById("reveal-body").classList.add("show");
  document.getElementById("start").hidden = true;
  document.getElementById("picker").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;
  window.scrollTo(0,0);
}

/* ---------------- reveal with a short letter-cycling animation ---------------- */
var AXIS_LETTERS = [["E","I"],["S","N"],["T","F"],["J","P"]];
var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function revealResult(code){
  var t = TYPES[code];
  if(!t) return;

  if(prefersReducedMotion){
    showResult(code);
    return;
  }

  document.getElementById("start").hidden = true;
  document.getElementById("picker").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;
  window.scrollTo(0,0);

  var circle = document.getElementById("r-code");
  var revealBody = document.getElementById("reveal-body");
  revealBody.classList.remove("show");
  circle.classList.add("cycling");

  var finalLetters = code.split("");
  var letters = finalLetters.map(function(){ return ""; });
  var settled = [false, false, false, false];

  var cycleTimer = setInterval(function(){
    for(var i=0;i<4;i++){
      if(!settled[i]){
        var pair = AXIS_LETTERS[i];
        letters[i] = pair[Math.random() < 0.5 ? 0 : 1];
      }
    }
    circle.textContent = letters.join("");
  }, 55);

  [220, 440, 660, 880].forEach(function(delay, i){
    setTimeout(function(){
      settled[i] = true;
      letters[i] = finalLetters[i];
      circle.textContent = letters.join("");
    }, delay);
  });

  setTimeout(function(){
    clearInterval(cycleTimer);
    showResult(code);
  }, 1050);
}

document.getElementById("back-btn").addEventListener("click", function(){
  document.getElementById("result").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("picker").hidden = true;
  document.getElementById("start").hidden = false;
  document.getElementById("reveal-body").classList.remove("show");
  if(location.search) history.replaceState(null, "", location.pathname);
  window.scrollTo(0,0);
});

document.getElementById("copy-btn").addEventListener("click", function(){
  var msg = document.getElementById("copy-msg");
  var code = document.getElementById("r-code-label").textContent;
  var url = location.origin + location.pathname + "?type=" + code;
  navigator.clipboard.writeText(url).then(function(){
    msg.textContent = "URLをコピーしました";
    setTimeout(function(){ msg.textContent = ""; }, 2000);
  }).catch(function(){
    msg.textContent = "コピーできませんでした。URLを手動でコピーしてください";
  });
});

/* ---------------- open directly from a shared link (?type=ISTP) ---------------- */
var params = new URLSearchParams(location.search);
var sharedType = (params.get("type") || "").toUpperCase();
if(sharedType && TYPES[sharedType]){
  showResult(sharedType);
}

})();
